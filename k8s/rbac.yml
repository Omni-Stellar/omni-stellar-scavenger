apiVersion: v1
kind: Namespace
metadata:
  name: omni-stellar-scavenger
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: omni-stellar-scavenger
  namespace: omni-stellar-scavenger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: omni-stellar-scavenger-role
  namespace: omni-stellar-scavenger
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: omni-stellar-scavenger-rolebinding
  namespace: omni-stellar-scavenger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: omni-stellar-scavenger-role
subjects:
- kind: ServiceAccount
  name: omni-stellar-scavenger
  namespace: omni-stellar-scavenger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: omni-stellar-scavenger-cluster-role
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: omni-stellar-scavenger-cluster-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: omni-stellar-scavenger-cluster-role
subjects:
- kind: ServiceAccount
  name: omni-stellar-scavenger
  namespace: omni-stellar-scavenger
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: omni-stellar-scavenger-pdb
  namespace: omni-stellar-scavenger
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: omni-stellar-scavenger-contract
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: omni-stellar-scavenger-quota
  namespace: omni-stellar-scavenger
spec:
  hard:
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    pods: "100"